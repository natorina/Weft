<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weft: run automatically</title>
<style>
  :root {
    --paper: #f6f1e6; --ink: #1f1c18; --muted: #6f675b; --stitch: #c9bda6; --brand: #2d3f6b; --brand-ink: #f6f1e6;
    --serif: ui-serif, "New York", "Iowan Old Style", Georgia, serif; --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #1d1b18; --ink: #ece5d6; --muted: #a59c8c; --stitch: #4d473c; --brand: #aebde6; --brand-ink: #1d1b18; }
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.5 var(--sans); }
  main { min-height: 100%; box-sizing: border-box; padding: 24px 26px; outline: 1px dashed var(--stitch); outline-offset: -8px; }
  .brand { display: flex; align-items: center; gap: 8px; font: 600 20px/1 var(--serif); margin-bottom: 16px; }
  .brand img { width: 22px; height: 22px; }
  h1 { font: 600 16px/1.35 var(--sans); margin: 0 0 8px; }
  p { margin: 0 0 10px; color: var(--muted); }
  b { color: var(--ink); }
  .buttons { display: flex; gap: 8px; margin-top: 18px; }
  button { flex: 1; font: 600 13px var(--sans); padding: 9px 12px; border-radius: 4px; cursor: pointer; border: 1px solid var(--stitch); background: transparent; color: var(--ink); }
  button.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .status { margin-top: 14px; font-weight: 600; min-height: 1.5em; }
</style>
</head>
<body>
<main>
  <div class="brand"><img src="icons/weft-48.png" alt="">weft</div>
  <h1>Run automatically on <span class="host"></span>?</h1>
  <p>Weft will open by itself whenever you visit <b class="host"></b>, so you don't have to click the icon each time.</p>
  <p>Your browser will ask to let Weft read that site. It only reads that store's pages, and you can turn this off anytime from the panel.</p>
  <div class="buttons">
    <button id="cancel">Not now</button>
    <button id="on" class="primary">Turn on</button>
  </div>
  <div class="status" role="status"></div>
</main>
<script src="enable.js"></script>
</body>
</html>
